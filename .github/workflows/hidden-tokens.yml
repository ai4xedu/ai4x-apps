name: hidden-tokens

# La suite signe ses licences avec la clé de TEST du dépôt : elle tourne
# ici sans aucun secret, chasse aux fuites comprise.
on:
  push:
    # La console admin aussi : test/politique.test.js vérifie le contrat poste ↔ console.
    paths: ["apps/hidden-tokens/**", "apps/nanomizer-admin/lib/**", ".github/workflows/hidden-tokens.yml"]
  pull_request:
    # La console admin aussi : test/politique.test.js vérifie le contrat poste ↔ console.
    paths: ["apps/hidden-tokens/**", "apps/nanomizer-admin/lib/**", ".github/workflows/hidden-tokens.yml"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/hidden-tokens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/hidden-tokens/package-lock.json
      - run: npm ci
      - run: npm test

  # La preuve « zéro réseau » (test/reseau.test.js) a besoin du modèle de
  # permissions de Node 25+ : sous Node 22, elle serait ignorée en vert. Ici
  # elle est EXIGÉE — un Node qui ne sait pas couper le réseau fait échouer.
  preuve-reseau:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hidden-tokens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/hidden-tokens/package-lock.json
      - run: npm ci
      - run: node --test test/reseau.test.js
        env:
          NANOMIZER_PREUVE_RESEAU: "1"

  # HT-Bench : le jeu synthétique est-il bien celui de la graine, et le rappel
  # des identifiants directs (noms, pièces, téléphones, e-mails, IBAN/RIB…)
  # reste-t-il au moins à la référence (bench/ht-bench/reference.json), pack
  # par pack et type par type ? Un seul OS : le banc mesure le moteur, pas la
  # plateforme. Le rapport complet est joint à l'exécution.
  ht-bench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hidden-tokens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/hidden-tokens/package-lock.json
      - run: npm ci
      - run: npm run bench:ht:controle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ht-bench-rapport
          path: apps/hidden-tokens/bench/ht-bench/resultats/
