name: nanomizer-admin

# Console admin de la politique : aucune dépendance, aucun secret. Elle suit
# aussi le moteur du connecteur (test/catalogue.test.js), d'où le second
# chemin surveillé.
on:
  push:
    paths: ["apps/nanomizer-admin/**", "apps/mcp-anonymiseur/server/engine.js", ".github/workflows/nanomizer-admin.yml"]
  pull_request:
    paths: ["apps/nanomizer-admin/**", "apps/mcp-anonymiseur/server/engine.js", ".github/workflows/nanomizer-admin.yml"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/nanomizer-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
