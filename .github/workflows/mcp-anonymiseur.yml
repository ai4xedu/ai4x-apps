name: mcp-anonymiseur

# La suite signe ses licences avec la clé de TEST du dépôt : elle tourne
# ici sans aucun secret, chasse aux fuites comprise.
on:
  push:
    paths: ["apps/mcp-anonymiseur/**", ".github/workflows/mcp-anonymiseur.yml"]
  pull_request:
    paths: ["apps/mcp-anonymiseur/**", ".github/workflows/mcp-anonymiseur.yml"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/mcp-anonymiseur
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mcp-anonymiseur/package-lock.json
      - run: npm ci
      - run: npm test

  # La preuve « zéro réseau » (test/reseau.test.js) a besoin du modèle de
  # permissions de Node 25+ : sous Node 22, elle serait ignorée en vert. Ici
  # elle est EXIGÉE — un Node qui ne sait pas couper le réseau fait échouer.
  preuve-reseau:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp-anonymiseur
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/mcp-anonymiseur/package-lock.json
      - run: npm ci
      - run: node --test test/reseau.test.js
        env:
          NANOMIZER_PREUVE_RESEAU: "1"
